<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="PoseMan 姿勢人偶：網頁版 3D 擺姿勢參考工具。拖曳關節擺姿勢、套用姿勢範本、多人物男/女體型、匯出參考圖。"
    />
    <title>姿勢人偶 PoseMan</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar" class="ui-hide">
        <h1>姿勢人偶 PoseMan</h1>
        <span id="figInfo"></span>
      </header>

      <aside id="panel" class="ui-hide">
        <label for="jointSelect">關節 Joint</label>
        <select id="jointSelect"></select>

        <div class="slider-row">
          <span>X</span>
          <input type="range" id="rotX" min="-180" max="180" step="1" value="0" />
          <span id="rotXVal">0°</span>
        </div>
        <div class="slider-row">
          <span>Y</span>
          <input type="range" id="rotY" min="-180" max="180" step="1" value="0" />
          <span id="rotYVal">0°</span>
        </div>
        <div class="slider-row">
          <span>Z</span>
          <input type="range" id="rotZ" min="-180" max="180" step="1" value="0" />
          <span id="rotZVal">0°</span>
        </div>

        <div class="btnrow">
          <button id="resetJointBtn" type="button">重設關節</button>
          <button id="resetPoseBtn" type="button">重設姿勢</button>
        </div>
        <div class="btnrow">
          <button id="genderBtn" type="button">切換性別</button>
          <button id="resetViewBtn" type="button">重設視角</button>
        </div>

        <label class="check-row" for="gridToggle">
          <input type="checkbox" id="gridToggle" checked />
          顯示地面格線
        </label>

        <label for="presetSelect">姿勢範本 Preset</label>
        <select id="presetSelect">
          <option value="">選擇姿勢…</option>
        </select>

        <label for="propSelect">物品 Props</label>
        <select id="propSelect">
          <option value="">加入物品…</option>
        </select>
        <div class="btnrow">
          <button id="rotatePropBtn" type="button">旋轉物品</button>
          <button id="deletePropBtn" type="button">刪除物品</button>
        </div>

        <label>檔案 Scene</label>
        <div class="btnrow">
          <button id="saveFileBtn" type="button">存檔</button>
          <button id="loadFileBtn" type="button">讀檔</button>
        </div>
        <input type="file" id="fileInput" accept=".json,application/json" hidden />

        <p id="tip">點選關節後拖曳或滑桿微調；「移動模式」直接拖曳人物／物品自由移動，或用方向軸 gizmo 精確移動。物品可旋轉／刪除。AI：設定 OpenAI 相容 API 後以對話控制。空白處拖曳 = 旋轉視角。</p>
      </aside>

      <div id="hint" class="ui-hide">拖曳關節擺姿勢 ・ 移動模式直接拖曳人物/物品自由移動 ・ 空白處旋轉視角</div>

      <div id="chat">
        <div id="chatHead">
          <span>AI 助手</span>
          <button id="aiSettingsBtn" type="button" title="AI API 設定">⚙</button>
        </div>
        <div id="aiSettings" hidden>
          <input id="aiBaseUrl" placeholder="Base URL（如 https://api.openai.com/v1）" />
          <input id="aiModel" placeholder="模型（如 gpt-4o-mini）" />
          <input id="aiKey" type="password" placeholder="API Key（留空＝不需金鑰）" />
          <button id="aiSaveBtn" type="button">儲存設定</button>
        </div>
        <div id="chatLog"></div>
        <div id="chatStatus"></div>
        <div id="chatInputRow">
          <input id="chatInput" placeholder="例：把左手舉高、放一張椅子" />
          <button id="chatSend" type="button">送出</button>
        </div>
      </div>

      <footer id="bottombar">
        <div class="left-group">
          <button id="addBtn" class="round ui-hide" type="button" title="加入人物">＋</button>
          <button id="removeBtn" class="round ui-hide" type="button" title="移除人物">－</button>
        </div>
        <div class="center-group">
          <button id="moveBtn" class="pill ui-hide" type="button">移動模式</button>
          <button id="previewBtn" class="pill" type="button">預覽模式</button>
          <button id="aiBtn" class="pill ui-hide" type="button">AI</button>
        </div>
        <div class="right-group">
          <button id="exportBtn" class="pill" type="button">匯出參考圖</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
