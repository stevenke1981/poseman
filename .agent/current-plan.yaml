plan:
  objective: 交付 CHANGE-004 的掃描感寫實 PBR 程序人偶，保留姿勢、選取、多人物與 v1-v3 場景相容。
  tasks:
    - id: T1
      task: 建立 deterministic per-figure PBR 材質與皮膚微表面紋理
      output: MeshPhysicalMaterial、clearcoat/sheen/roughness、獨立 DataTexture 與安全 dispose
      verify: npm test 材質隔離、texture dispose、shared geometry 不處置
    - id: T2
      task: 擴充掃描感頭臉、軀幹、四肢與接地足型
      output: 可點選的眼窩/眼瞼/虹膜/瞳孔/角膜、鼻翼鼻孔、嘴唇、耳廓、鎖骨、手指、腳趾
      verify: npm test ground bounds 與 pick mesh 上限；待主代理瀏覽器視覺驗收
    - id: T3
      task: 加入眼色/膚質欄位並升版場景契約
      output: v4 appearance 欄位、v1-v3 安全預設、重建保留 pose/position/selection
      verify: npm test sanitizer/prototype/round-trip/rebuild；待主代理 persistence 驗收
    - id: T4
      task: 調整棚拍光線、色彩空間與文件
      output: sRGB + ACES、key/fill/rim、README 與 CHANGE-004 evidence
      verify: npm run build/check、git diff --check；待主代理 visual/export 驗收
    - id: T5
      task: 主代理真人驗收與 baseline 判定
      output: 瀏覽器人物細節、姿勢拖曳、多人物隔離、預覽/匯出、舊場景讀取證據
      verify: 主代理實際瀏覽器驗收；完成前維持 pending
status: completed
note: CHANGE-004 以 PASSED_WITH_LIMITATIONS 驗收；程序化掃描感、互動與重新整理保存已由主代理實際瀏覽器操作通過，真實 photogrammetry 資產不在本次範圍。
