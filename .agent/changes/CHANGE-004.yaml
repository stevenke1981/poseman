  persistence: PASS
  critical_errors: PASS
  note: 程序化掃描感與互動流程已通過；不宣稱為真實攝影測量掃描資產。v2 UI 讀檔受瀏覽器 file chooser timeout，改由 21 項可重跑測試覆蓋 v1-v3 相容。
